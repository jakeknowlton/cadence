name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:oxlint
      - run: pnpm lint:eslint
      - run: pnpm type-check
      - run: pnpm test:unit
      - run: pnpm build
