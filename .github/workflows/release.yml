name: Release

# Production deploys happen only from a version tag (v1.2.3) that points at a commit on main,
# and only after a required reviewer approves the "production" environment.
on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag must point at a commit on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. Tag a commit that has been merged to main."
            exit 1
          fi
      - name: Tag must match package.json version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg. Use 'pnpm release <patch|minor|major>'."
            exit 1
          fi

  check:
    needs: verify-tag
    uses: ./.github/workflows/check.yml
    with:
      mode: production

  deploy-prod:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://cadence-jkn-prod.web.app
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist-production
          path: dist
      - name: Load deploy credentials
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_PROD is not set on the production environment."
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
      - name: Deploy to cadence-jkn-prod
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: pnpm exec firebase deploy --project cadence-jkn-prod --non-interactive --force --message "$GITHUB_REF_NAME"
      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
