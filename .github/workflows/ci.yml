name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:oxlint
      - run: pnpm lint:eslint
      - run: pnpm type-check
      - run: pnpm test:unit
      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm test:rules
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm build:staging
      - uses: actions/upload-artifact@v4
        with:
          name: dist-staging
          path: dist
          retention-days: 3

  deploy-dev:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://cadence-jkn-dev.web.app
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist-staging
          path: dist
      - name: Check for deploy credentials
        id: creds
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
        run: |
          if [ -z "$SA" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FIREBASE_SERVICE_ACCOUNT_DEV is not set; skipping deploy"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          fi
      - name: Deploy to cadence-jkn-dev
        if: steps.creds.outputs.deploy == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: pnpm exec firebase deploy --project cadence-jkn-dev --non-interactive --force
      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
