name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/check.yml
    with:
      mode: staging

  deploy-dev:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://cadence-jkn-dev.web.app
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist-staging
          path: dist
      - name: Check for deploy credentials
        id: creds
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
        run: |
          if [ -z "$SA" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FIREBASE_SERVICE_ACCOUNT_DEV is not set; skipping deploy"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          fi
      - name: Deploy to cadence-jkn-dev
        if: steps.creds.outputs.deploy == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: pnpm exec firebase deploy --project cadence-jkn-dev --non-interactive --force
      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
